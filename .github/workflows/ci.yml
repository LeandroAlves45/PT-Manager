name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ptmanager
          POSTGRES_PASSWORD: ptmanager
          POSTGRES_DB: ptmanager_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ptmanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore
        run: dotnet restore backend/PTManager.sln --locked-mode

      - name: Build
        run: dotnet build backend/PTManager.sln --configuration Release --no-restore

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=ptmanager_ci;Username=ptmanager;Password=ptmanager
        run: >-
          dotnet test backend/PTManager.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage

      # Cobertura medida no CI #61: linhas 96.2%, ramos 64.8%. Os limiares ficam 2 pontos abaixo,
      # para apanhar uma regressão real sem falhar por ruído (plano do Sprint 8, G8A).
      - name: Cobertura (resumo e limiar)
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.9
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:"MarkdownSummaryGithub;TextSummary" -assemblyfilters:"+Domain;+Application;+Infrastructure;+Api"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          line=$(grep -E '^ *Line coverage:' coverage/report/Summary.txt | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          branch=$(grep -E '^ *Branch coverage:' coverage/report/Summary.txt | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          echo "Linhas: $line% (mínimo 94) | Ramos: $branch% (mínimo 62)"
          awk -v l="$line" -v b="$branch" 'BEGIN { exit !(l >= 94 && b >= 62) }'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Corre a suite com cobertura (V8) e mostra o resumo no job. Ainda sem limiar: fixa-se
      # depois de medir no CI (plano do Sprint 8, G8A), para não inventar um número.
      - name: Test (com cobertura)
        run: npm run test:coverage -- --coverage.reporter=text-summary --coverage.reporter=json-summary

      - name: Cobertura (resumo)
        if: always()
        run: |
          echo '### Cobertura do frontend' >> "$GITHUB_STEP_SUMMARY"
          node -e "const t=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('- '+k+': '+t[k].pct+'%')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  site:
    name: Site de marketing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (dependências de produção)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # Os testes leem frontend/…/globals.css e backend/…/SubscriptionTier.cs (checkout completo).
      - name: Test
        run: npm run test:run

      - name: Build (SSR + pré-render)
        run: npm run build

  contract:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ptmanager
          POSTGRES_PASSWORD: ptmanager
          POSTGRES_DB: ptmanager_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ptmanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=ptmanager_contract;Username=ptmanager;Password=ptmanager
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5045
      Cors__AllowedOrigins__0: https://frontend.test
      Jwt__Issuer: https://api.test
      Jwt__Audience: ptmanager-contract
      Jwt__SigningKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      Jwt__ClockSkew: 00:00:30
      AuthCookies__SameSite: Lax
      Google__ClientId: ptmanager-contract.apps.googleusercontent.com
      Resend__ApiKey: ci-resend-placeholder
      Resend__FromAddress: no-reply@ptmanager.test
      Resend__FrontendBaseUrl: https://frontend.test
      Resend__BaseAddress: https://resend.test/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build API
        run: dotnet build backend/src/Api/Api.csproj --configuration Release

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Apply migrations explicitly
        run: >-
          dotnet ef database update
          --project backend/src/Infrastructure/Infrastructure.csproj
          --startup-project backend/src/Api/Api.csproj
          --configuration Release
          --no-build

      - name: Start API and wait for readiness
        run: |
          dotnet run --project backend/src/Api/Api.csproj --configuration Release --no-build --no-launch-profile &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5045/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "A API não ficou pronta a tempo."
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API types
        working-directory: frontend
        run: npm run api:types:check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ptmanager
          POSTGRES_PASSWORD: ptmanager
          POSTGRES_DB: ptmanager_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ptmanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # A API corre em Development com o seed ligado e os emails escritos no log. O Stripe, o
    # Cloudinary, o R2 e a telemetria ficam desligados (valores por omissão do appsettings),
    # por isso o job não precisa de nenhum segredo.
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=ptmanager_e2e;Username=ptmanager;Password=ptmanager
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://localhost:7186
      Cors__AllowedOrigins__0: https://localhost:5173
      Jwt__Issuer: https://localhost:7186
      Jwt__Audience: ptmanager-e2e
      Jwt__SigningKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      Jwt__ClockSkew: 00:00:30
      AuthCookies__SameSite: Lax
      Google__ClientId: ptmanager-e2e.apps.googleusercontent.com
      Resend__ApiKey: ci-resend-placeholder
      Resend__FromAddress: no-reply@ptmanager.test
      Resend__FrontendBaseUrl: https://localhost:5173/
      DevelopmentSeed__Enabled: 'true'
      DevelopmentSeed__Password: E2e-Seed-Password-1!
      DevelopmentEmail__LogLinks: 'true'
      E2E_SEED_PASSWORD: E2e-Seed-Password-1!
      E2E_API_LOG: ${{ github.workspace }}/api.log

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build API
        run: dotnet build backend/src/Api/Api.csproj --configuration Release

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Apply migrations explicitly
        run: >-
          dotnet ef database update
          --project backend/src/Infrastructure/Infrastructure.csproj
          --startup-project backend/src/Api/Api.csproj
          --configuration Release
          --no-build

      - name: Create the development certificate
        run: dotnet dev-certs https

      - name: Start API and wait for readiness
        run: |
          dotnet run --project backend/src/Api/Api.csproj --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -ksf https://localhost:7186/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "A API não ficou pronta a tempo."
          cat api.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build SPA against the local API
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://localhost:7186
        run: npm run build

      - name: E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
          retention-days: 7
