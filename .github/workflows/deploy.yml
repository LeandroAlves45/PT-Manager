# .github/workflows/deploy.yml — PT Manager Full-Stack Deployment
#
# DEPLOYMENT FLOW:
#   1. CI passa (backend tests + frontend lint/build/tests)
#   2. Deploy automático é disparado em main
#   3. Backend → Render via webhook
#   4. Frontend → Vercel CLI
#
# SECRETS NECESSÁRIOS (Settings → Secrets → Actions):
#   - RENDER_DEPLOY_HOOK: webhook do Render para backend
#   - VERCEL_TOKEN: token de acesso Vercel
#   - VERCEL_ORG_ID: ID da organização/time no Vercel
#   - VERCEL_PROJECT_ID: ID do projeto no Vercel

name: Deploy (Production)

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main]
    types: [completed]

jobs:
  # ──────────────────────────────────────────────────────────
  # Verifica se o CI passou antes de fazer deploy
  # ──────────────────────────────────────────────────────────
  check-ci-status:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - name: Check if tests passed
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "✅ All CI tests passed — proceeding with deployment"
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "❌ CI tests failed — skipping deployment"
          fi

  # ──────────────────────────────────────────────────────────
  # DEPLOY BACKEND: Trigger Render via webhook
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: ${{ needs.check-ci-status.outputs.proceed == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deployment
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK não está configurado"
            echo ""
            echo "Para configurar:"
            echo "1. Vai a: Settings → Secrets → Actions → New secret"
            echo "2. Nome: RENDER_DEPLOY_HOOK"
            echo "3. Valor: copia o webhook do Render Dashboard"
            echo "   (Service → Deploy → Manual Deploy → Webhook URL)"
            exit 0
          fi

          echo "🚀 Disparando deploy do Backend no Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            --fail-with-body \
            && echo "✅ Deploy do backend disparado com sucesso" \
            || echo "❌ Erro ao disparar deploy do backend"

  # ──────────────────────────────────────────────────────────
  # DEPLOY FRONTEND: Vercel CLI
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: ${{ needs.check-ci-status.outputs.proceed == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || \
             [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || \
             [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ ERRO: Secrets do Vercel não configurados"
            echo ""
            echo "Para configurar:"
            echo "1. Vai a: Settings → Secrets → Actions"
            echo "2. Cria estes secrets:"
            echo "   - VERCEL_TOKEN"
            echo "     (De: vercel.com → Settings → Tokens → Create)"
            echo "   - VERCEL_ORG_ID"
            echo "     (De: Vercel Dashboard → Settings → Team ID)"
            echo "   - VERCEL_PROJECT_ID"
            echo "     (De: Vercel Dashboard → Projeto → Settings)"
            exit 1
          fi
          echo "✅ Todos os secrets do Vercel configurados"

      - name: Deploy para produção
        working-directory: frontend
        run: |
          echo "🚀 Disparando deploy do Frontend no Vercel..."
          vercel deploy \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.VERCEL_ORG_ID }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ──────────────────────────────────────────────────────────
  # MANUAL DEPLOYMENT (fallback)
  # Se os deploys automáticos falharem, usa este workflow
  # ──────────────────────────────────────────────────────────
  manual-deploy:
    name: Manual Deployment Trigger
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always() && failure()

    steps:
      - name: Report deployment status
        run: |
          echo "⚠️  Um ou mais deploys falharam"
          echo ""
          echo "Para fazer deploy manual:"
          echo "1. Vai para Actions tab"
          echo "2. Seleciona 'Manual Deploy'"
          echo "3. Clica 'Run workflow'"
          echo ""
          echo "Status:"
          echo "- Backend: ${{ needs.deploy-backend.result }}"
          echo "- Frontend: ${{ needs.deploy-frontend.result }}"
